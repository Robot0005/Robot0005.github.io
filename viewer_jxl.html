<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>JPEG XL Mobile Viewer</title>
    <style>
        body { background-color: black; margin: 0; height: 100dvh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        #viewer { position: relative; width: 100vw; height: 100dvh; display: flex; justify-content: center; align-items: center; touch-action: none; overflow: hidden; }
        
        .photo { 
            position: absolute; max-width: 100%; max-height: 100%; width: auto; height: auto; 
            object-fit: contain; opacity: 0; pointer-events: none;
            will-change: transform; transform-origin: center center;
            transition: opacity 0.3s ease;
        }
        .active { opacity: 1; z-index: 2; pointer-events: auto; }
        .visible-back { opacity: 1; z-index: 1; }
        
        #counter { position: absolute; top: 20px; left: 20px; color: rgba(255, 255, 255, 0.7); font-size: 14px; z-index: 10; pointer-events: none; display: none; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 100px; color: rgba(255, 255, 255, 0.2); font-size: 40px; display: none; justify-content: center; align-items: center; z-index: 100; }
        #btn-left { left: 0; } #btn-right { right: 0; }

        .top-right-container { position: absolute; right: 20px; top: 20px; z-index: 110; }
        .back-btn { color: white; font-size: 30px; text-decoration: none; opacity: 0.5; }

        #error-overlay { position: fixed; inset: 0; background: #000; color: #ff5555; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 4px; margin: 5px; font-weight: bold; font-size: 14px; border: 1px solid currentColor; }
        .bad { background: #330000; color: #ff8888; }
        .good { background: #002200; color: #88ff88; }
    </style>
</head>
<body>
    <div id="error-overlay">
        <h2 id="error-title">Environment Check</h2>
        <div id="status-list"></div>
        <a href="index.html" style="color: #888; margin-top: 20px;">戻る</a>
    </div>

    <div id="counter">1 / --</div>
    <div class="top-right-container"><a href="index.html" class="back-btn">&times;</a></div>

    <div id="viewer">
        <div id="btn-left" class="nav-btn" onclick="prevImage()">&#10094;</div>
        <div id="btn-right" class="nav-btn" onclick="nextImage()">&#10095;</div>
        <img id="imgA" class="photo" draggable="false"><img id="imgB" class="photo" draggable="false">
    </div>

    <script>
        const fileList = [
            "images/2024-05-18_16-05-48.jxl", "images/2024-05-18_17-32-47.jxl", "images/2024-08-04_12-25-28.jxl",
            "images/2024-08-04_12-30-45.jxl", "images/2024-09-16_12-05-16.jxl", "images/2024-09-16_12-19-28.jxl",
            "images/2024-09-16_12-32-16.jxl", "images/2024-09-16_13-30-08.jxl", "images/2025-04-07_16-23-44.jxl",
            "images/2025-04-07_16-58-12.jxl", "images/2025-04-07_16-59-11.jxl", "images/2025-04-09_22-32-08.jxl",
            "images/2025-05-10_12-03-50.jxl", "images/2025-05-10_12-07-23.jxl", "images/2025-05-10_12-50-19.jxl",
            "images/2025-05-10_13-01-26.jxl", "images/2025-05-10_13-30-50.jxl", "images/2025-05-10_13-30-57.jxl",
            "images/2025-05-10_14-11-24.jxl", "images/2025-06-14_16-03-05.jxl", "images/2025-06-14_16-10-54.jxl",
            "images/2025-07-12_19-00-46.jxl", "images/2025-10-11_14-43-18.jxl", "images/2025-10-11_14-46-54.jxl",
            "images/2025-10-11_14-56-06.jxl", "images/2025-10-19_14-24-13.jxl", "images/2025-11-01_14-24-16.jxl",
            "images/2025-11-01_21-17-07.jxl", "images/2025-11-02_16-40-41.jxl", "images/2025-11-02_16-59-44.jxl",
            "images/2025-09-26_14-06-04.jxl", "images/2025-09-27_15-35-25.jxl", "images/2025-09-26_17-55-09.jxl",
            "images/2025-09-27_11-16-00.jxl"
        ].sort();

        let currentIndex = 0, useA = true;
        const imgA = document.getElementById('imgA'), imgB = document.getElementById('imgB'), viewer = document.getElementById('viewer');

        // タッチステート
        let state = { scale: 1, lastScale: 1, x: 0, y: 0, lastX: 0, lastY: 0, touchX: 0, touchY: 0, dist: 0, lastTap: 0 };

        function updateTransform(animate = false) {
            const el = useA ? imgB : imgA;
            el.style.transition = animate ? "transform 0.3s ease-out" : "none";
            el.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        }

        async function checkEnvironment() {
            const jxlSupport = await new Promise(r => {
                const i = new Image(); i.src = "data:image/jxl;base64,/wr8BggB";
                i.onload = () => r(true); i.onerror = () => r(false);
                setTimeout(() => r(false), 800);
            });
            const hdrSupport = window.matchMedia('(dynamic-range: high)').matches || (window.screen.highDynamicRangeSupported === true);

            if (jxlSupport && hdrSupport) {
                document.getElementById('counter').style.display = 'block';
                document.querySelectorAll('.nav-btn').forEach(b => b.style.display = 'flex');
                updateImage();
            } else {
                document.getElementById('error-overlay').style.display = 'flex';
                document.getElementById('status-list').innerHTML = `<div class="status-badge ${jxlSupport?'good':'bad'}">JXL: ${jxlSupport?'OK':'NG'}</div><div class="status-badge ${hdrSupport?'good':'bad'}">HDR: ${hdrSupport?'OK':'NG'}</div>`;
            }
        }

        function updateImage() {
            state.scale = 1; state.x = 0; state.y = 0;
            const current = useA ? imgA : imgB, next = useA ? imgB : imgA;
            useA = !useA;
            current.classList.remove('active');
            next.src = fileList[currentIndex];
            next.onload = () => {
                next.classList.add('active');
                document.getElementById('counter').innerText = `${currentIndex + 1} / ${fileList.length}`;
                updateTransform();
            };
        }

        function nextImage() { currentIndex = (currentIndex + 1) % fileList.length; updateImage(); }
        function prevImage() { currentIndex = (currentIndex - 1 + fileList.length) % fileList.length; updateImage(); }

        // タッチイベント処理
        viewer.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                state.dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                state.lastScale = state.scale;
            } else if (e.touches.length === 1) {
                const now = Date.now();
                if (now - state.lastTap < 300) {
                    state.scale = state.scale > 1.2 ? 1 : 2.5;
                    state.x = 0; state.y = 0;
                    updateTransform(true);
                }
                state.lastTap = now;
                state.touchX = e.touches[0].pageX - state.x;
                state.touchY = e.touches[0].pageY - state.y;
                state.lastX = e.touches[0].pageX;
            }
        }, { passive: false });

        viewer.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                state.scale = Math.min(Math.max(state.lastScale * (d / state.dist), 1), 5);
                updateTransform();
            } else if (e.touches.length === 1) {
                if (state.scale > 1.05) {
                    state.x = e.touches[0].pageX - state.touchX;
                    state.y = e.touches[0].pageY - state.touchY;
                    updateTransform();
                }
            }
        }, { passive: false });

        viewer.addEventListener('touchend', e => {
            if (state.scale <= 1.05 && e.touches.length === 0) {
                const diff = e.changedTouches[0].pageX - state.lastX;
                if (Math.abs(diff) > 60) diff > 0 ? prevImage() : nextImage();
            }
        });

        checkEnvironment();
    </script>
</body>
</html>
