<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>JPEG XL Viewer</title>
    <style>
        body { background-color: black; margin: 0; height: 100dvh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        
        /* 拡大時に画像が切れないよう、コンテナの設定を調整 */
        #viewer { 
            position: relative; width: 100vw; height: 100dvh; 
            display: flex; justify-content: center; align-items: center; 
            touch-action: none; overflow: hidden;
        }
        
        .photo { 
            position: absolute; max-width: 100%; max-height: 100%; 
            width: auto; height: auto; object-fit: contain; 
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            will-change: transform;
            transform-origin: center center;
        }

        .active { opacity: 1; z-index: 2; pointer-events: auto; }
        .visible-back { opacity: 1; z-index: 1; }
        
        #counter { position: absolute; top: 20px; left: 20px; color: rgba(255, 255, 255, 0.7); padding: 8px 16px; font-size: 14px; z-index: 10; display: none; pointer-events: none; }
        
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 60px; height: 80px; color: rgba(255, 255, 255, 0.3); font-size: 40px;
            display: none; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s; user-select: none; z-index: 100;
        }
        #btn-left { left: 10px; }
        #btn-right { right: 10px; }

        .top-right-container { position: absolute; right: 20px; top: 20px; z-index: 110; }
        .back-btn { color: rgba(255, 255, 255, 0.7); font-size: 38px; text-decoration: none; line-height: 1; cursor: pointer; }

        #error-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            background: #000; color: #ff5555; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 40px; box-sizing: border-box;
        }
        h2 { color: white; font-size: 22px; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; margin: 5px; font-weight: bold; font-size: 14px; }
        .bad { background: #551111; color: #ff8888; border: 1px solid #ff5555; }
        .good { background: #113311; color: #88ff88; border: 1px solid #55ff55; }
        .error-list { text-align: left; color: #ccc; font-size: 14px; }
        .error-back-btn { margin-top: 30px; color: #888; text-decoration: none; border-bottom: 1px solid #444; }
    </style>
</head>
<body>
    <div id="error-overlay">
        <h2 id="error-title">環境を確認中...</h2>
        <div id="status-list"></div>
        <div id="error-advice"><ul id="dynamic-error-list" class="error-list"></ul></div>
        <a href="index.html" class="error-back-btn">戻る</a>
    </div>

    <div id="counter">1 / --</div>
    <div class="top-right-container"><a href="index.html" class="back-btn">&times;</a></div>

    <div id="viewer">
        <div id="btn-left" class="nav-btn" onclick="prevImage()">&#10094;</div>
        <div id="btn-right" class="nav-btn" onclick="nextImage()">&#10095;</div>
        <img id="imgA" class="photo" src=""><img id="imgB" class="photo" src="">
    </div>

    <script>
        const fileList = [
            "images/2024-05-18_16-05-48.jxl", "images/2024-05-18_17-32-47.jxl", "images/2024-08-04_12-25-28.jxl",
            "images/2024-08-04_12-30-45.jxl", "images/2024-09-16_12-05-16.jxl", "images/2024-09-16_12-19-28.jxl",
            "images/2024-09-16_12-32-16.jxl", "images/2024-09-16_13-30-08.jxl", "images/2025-04-07_16-23-44.jxl",
            "images/2025-04-07_16-58-12.jxl", "images/2025-04-07_16-59-11.jxl", "images/2025-04-09_22-32-08.jxl",
            "images/2025-05-10_12-03-50.jxl", "images/2025-05-10_12-07-23.jxl", "images/2025-05-10_12-50-19.jxl",
            "images/2025-05-10_13-01-26.jxl", "images/2025-05-10_13-30-50.jxl", "images/2025-05-10_13-30-57.jxl",
            "images/2025-05-10_14-11-24.jxl", "images/2025-06-14_16-03-05.jxl", "images/2025-06-14_16-10-54.jxl",
            "images/2025-07-12_19-00-46.jxl", "images/2025-10-11_14-43-18.jxl", "images/2025-10-11_14-46-54.jxl",
            "images/2025-10-11_14-56-06.jxl", "images/2025-10-19_14-24-13.jxl", "images/2025-11-01_14-24-16.jxl",
            "images/2025-11-01_21-17-07.jxl", "images/2025-11-02_16-40-41.jxl", "images/2025-11-02_16-59-44.jxl",
            "images/2025-09-26_14-06-04.jxl", "images/2025-09-27_15-35-25.jxl", "images/2025-09-26_17-55-09.jxl",
            "images/2025-09-27_11-16-00.jxl"
        ];
        fileList.sort();

        let currentIndex = 0, useA = true;
        const imgA = document.getElementById('imgA'), imgB = document.getElementById('imgB'), 
              counter = document.getElementById('counter'), navBtns = document.querySelectorAll('.nav-btn'),
              viewer = document.getElementById('viewer');

        // タッチ操作用変数
        let scale = 1, lastScale = 1;
        let posX = 0, posY = 0;
        let lastPosX = 0, lastPosY = 0;
        let startX = 0, startY = 0;
        let initialPinchDist = 0;
        let lastTapTime = 0;

        function applyTransform() {
            const currentImg = useA ? imgA : imgB;
            currentImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        function resetTransform() {
            scale = 1; posX = 0; posY = 0;
            applyTransform();
        }

        async function checkEnvironment() {
            const checkJxl = () => new Promise((r) => { 
                const i = new Image(); i.src = "data:image/jxl;base64,/wr8BggB"; // 最小限のJxlヘッダ
                i.onload = () => r(true); i.onerror = () => r(false);
                setTimeout(() => r(false), 1000);
            });
            const jxlSupport = await checkJxl();
            const hdrSupport = window.matchMedia('(dynamic-range: high)').matches || (window.screen.highDynamicRangeSupported === true);

            if (jxlSupport && hdrSupport) {
                document.getElementById('error-overlay').style.display = 'none';
                counter.style.display = 'block';
                navBtns.forEach(btn => btn.style.display = 'flex');
                updateImage();
            } else {
                document.getElementById('error-overlay').style.display = 'flex';
                document.getElementById('error-title').innerText = "環境エラー";
                document.getElementById('status-list').innerHTML = `<div class="status-badge ${jxlSupport?'good':'bad'}">JXL: ${jxlSupport?'OK':'NG'}</div><div class="status-badge ${hdrSupport?'good':'bad'}">HDR: ${hdrSupport?'OK':'NG'}</div>`;
            }
        }

        function updateImage() {
            resetTransform();
            const currentImg = useA ? imgA : imgB, nextImg = useA ? imgB : imgA;
            useA = !useA;
            currentImg.classList.remove('active');
            currentImg.classList.add('visible-back');
            nextImg.src = fileList[currentIndex];
            nextImg.onload = () => {
                nextImg.classList.add('active');
                setTimeout(() => currentImg.classList.remove('visible-back'), 150);
                counter.innerText = `${currentIndex + 1} / ${fileList.length}`;
            };
        }

        function nextImage() { currentIndex = (currentIndex + 1) % fileList.length; updateImage(); }
        function prevImage() { currentIndex = (currentIndex - 1 + fileList.length) % fileList.length; updateImage(); }

        // --- スマートフォン向けタッチ制御 ---
        viewer.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                // ピンチ開始
                initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                lastScale = scale;
            } else if (e.touches.length === 1) {
                // シングルタップ/ダブルタップ判定
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    // ダブルタップでリセット or 拡大
                    scale === 1 ? scale = 2.5 : scale = 1;
                    posX = 0; posY = 0;
                    applyTransform();
                    lastTapTime = 0;
                } else {
                    lastTapTime = now;
                    startX = e.touches[0].pageX - posX;
                    startY = e.touches[0].pageY - posY;
                }
            }
        }, { passive: false });

        viewer.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 2) {
                // ピンチズーム
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = Math.min(Math.max(lastScale * (dist / initialPinchDist), 1), 5);
                applyTransform();
            } else if (e.touches.length === 1 && scale > 1) {
                // 拡大中のドラッグ移動
                posX = e.touches[0].pageX - startX;
                posY = e.touches[0].pageY - startY;
                applyTransform();
            }
        }, { passive: false });

        viewer.addEventListener('touchend', e => {
            if (e.touches.length === 0 && scale === 1) {
                // 等倍時の左右スワイプ送り
                const dist = e.changedTouches[0].pageX - (startX + posX);
                if (Math.abs(dist) > 80) dist > 0 ? prevImage() : nextImage();
            }
        });

        checkEnvironment();
    </script>
</body>
</html>
